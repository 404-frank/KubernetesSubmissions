apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong-app
  template:
    metadata:
      labels:
        app: ping-pong-app
    spec:
      containers:
        - image: twodogwalker/ping-pong-app:0.1
          imagePullPolicy: IfNotPresent
          name: ping-pong-container
