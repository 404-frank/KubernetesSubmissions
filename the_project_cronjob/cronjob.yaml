apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: project
  name: add-wikipedia-todo
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: add-wikipedia-todo
            image: twodogwalker/todo-app-cronjob:0.5
            imagePullPolicy: IfNotPresent
            # resources
            resources:
              requests:
                memory: "32Mi"
                cpu: "125m"
              limits:
                memory: "64Mi"
                cpu: "250m"
            env:
              - name: MONGODB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: mongodb-secrets
                    key: password
            envFrom:
              - configMapRef:
                  name: the-project-configmap
          restartPolicy: OnFailure
