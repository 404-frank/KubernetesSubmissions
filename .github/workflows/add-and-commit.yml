name: Build and publish application

on:
  push:

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag image with the GitHub SHA to get a unique tag
      - name: Build and publish backend
        run: |-
          docker build --tag "twodogwalker/todo-app:$GITHUB_SHA" ./the_project
          docker push "twodogwalker/todo-app:$GITHUB_SHA"
          docker build --tag "twodogwalker/todo-app-backend:$GITHUB_SHA" ./the_project_backend
          docker push "twodogwalker/todo-app-backend:$GITHUB_SHA"
          docker build --tag "twodogwalker/todo-app-distribute:$GITHUB_SHA" ./the_project_distributor
          docker push "twodogwalker/todo-app-distribute:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right image
        run: |-
          kustomize edit set image PROJECT/IMAGE_FRONTEND=twodogwalker/todo-app:$GITHUB_SHA
          kustomize edit set image PROJECT/IMAGE_BACKEND=twodogwalker/todo-app-backend:$GITHUB_SHA
          kustomize edit set image PROJECT/IMAGE_DISTRIBUTOR=twodogwalker/todo-app-distribute:$GITHUB_SHA

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: 'kustomization.yaml'
          message: New version released ${{ github.sha }}
