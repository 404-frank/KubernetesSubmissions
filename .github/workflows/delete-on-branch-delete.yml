name: Delete application on deletion of branch

on: delete

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-west4
  REGISTRY: europe-west4-docker.pkg.dev
  BRANCH: ${{ github.event.ref }}

# ...
jobs:
  no-build-delete:
    name: Deletion
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GKE_SA_KEY }}'
          
      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3
        
      - name: 'Use gcloud CLI'
        run: gcloud info
        
      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'
     
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Define correct namespace
        run: |
          if [[ $BRANCH == 'main' ]]; then
              echo "NAMESPACE=project" >> "$GITHUB_ENV"
          else
              echo "NAMESPACE=$BRANCH" >> "$GITHUB_ENV"
          fi
          echo "namespace to be delete: $NAMESPACE"
      
      - name: Deletion
        run: |-
          if [[ $NAMESPACE != 'project' ]]; then
            kubectl delete all --all -n $NAMESPACE
          fi
          echo "done deletion of items in namespace: ${NAMESPACE}"
