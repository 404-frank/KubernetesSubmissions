apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: exercises
  name: the-test-claim # name of the volume claim, this will be used in the deployment
spec:
  # removed for Google Cloud deployment:
  # storageClassName: the-test-pv # this is the name of the persistent volume we are claiming
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi