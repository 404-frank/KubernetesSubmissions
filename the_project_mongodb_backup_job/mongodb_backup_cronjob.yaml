apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: project
  name: mongodb-backup
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: mongodb-backup
            image: twodogwalker/mongodb-backup-cronjob:0.15
            imagePullPolicy: IfNotPresent
            # resources
            resources:
              requests:
                memory: "32Mi"
                cpu: "125m"
              limits:
                memory: "64Mi"
                cpu: "250m"
            env:
              - name: MONGODB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: mongodb-secrets
                    key: password
            envFrom:
              - configMapRef:
                  name: the-project-configmap
            volumeMounts:          
              - name: sa-secret
                mountPath: /usr/src/app/config/credentials.json
                subPath: dwk-gke-510518-71c74749d7e8.json
                readOnly: true
          volumes:
            - name: sa-secret
              secret:
                secretName: storage-sa-key
                items:
                  - key: dwk-gke-510518-71c74749d7e8.json
                    path: dwk-gke-510518-71c74749d7e8.json
          restartPolicy: Never
