apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output-app
  template:
    metadata:
      labels:
        app: log-output-app
    spec:
      volumes:
        - name: shared-image
          persistentVolumeClaim:
            claimName: log-output-claim
      containers:
        - name: log-output-container
          image: twodogwalker/log-output:0.8
          imagePullPolicy: IfNotPresent
          volumeMounts:
          - name: shared-image
            mountPath: /usr/src/app/sharedfiles
        - name: ping-pong-container
          image: twodogwalker/ping-pong-app:0.7
          imagePullPolicy: IfNotPresent
          volumeMounts:
          - name: shared-image
            mountPath: /usr/src/app/sharedfiles

