apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: log-output-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output-app
  template:
    metadata:
      labels:
        app: log-output-app
    spec:
      volumes:
        - name: shared-files
          configMap:
            name: log-output-configmap
      containers:
        - name: log-output-container
          image: twodogwalker/log-output:0.28
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: log-output-configmap
          volumeMounts:          
          - name: shared-files
            mountPath: /usr/src/app/shared
        - name: ping-pong-container
          image: twodogwalker/ping-pong-app:0.12
          imagePullPolicy: IfNotPresent


