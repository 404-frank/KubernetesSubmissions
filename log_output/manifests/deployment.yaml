apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output-app
  template:
    metadata:
      labels:
        app: log-output-app
    spec:
      containers:
        - name: log-output-container
          image: twodogwalker/log-output:0.21
          imagePullPolicy: IfNotPresent
        - name: ping-pong-container
          image: twodogwalker/ping-pong-app:0.12
          imagePullPolicy: IfNotPresent

