apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  namespace: exercises
  name: log-output-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: log-output-app
  strategy:
    canary:
      steps:
      - setWeight: 25
      - analysis:
          templates:
          - templateName: container-cpu-usage
  template:
    metadata:
      labels:
        app: log-output-app
    spec:
      volumes:
        - name: shared-files
          configMap:
            name: log-output-configmap
      containers:
        - name: log-output-container
          image: twodogwalker/log-output:0.40
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: log-output-configmap
          volumeMounts:          
          - name: shared-files
            mountPath: /usr/src/app/shared
          readinessProbe:
            initialDelaySeconds: 10 # Initial delay until the readiness is tested
            periodSeconds: 10 # How often to test
            httpGet:
               path: /healthz
               port: 5000
        - name: ping-pong-container
          image: twodogwalker/ping-pong-app:0.28
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          envFrom:
            - configMapRef:
                name: pingpong-configmap
          readinessProbe:
            initialDelaySeconds: 10 # Initial delay until the readiness is tested
            periodSeconds: 10 # How often to test
            httpGet:
               path: /healthz
               port: 5100


