<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helsinki ToDo application</title>
    <!-- <link rel="stylesheet" href="./static/site.css" /> -->
    <link rel="stylesheet" href="./static/my-tailwind.css" />
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100">
    <div class="container py-10 px-4 mx-auto max-w-[800px] flex flex-col items-center">

        <div class="w-full flex flex-col items-center rounded-xl overflow-hidden bg-gray-300">
            <!-- Red header -->
            <div class="w-full h-16 flex items-center justify-center bg-[#693434]">
                <div class="text-white text-3xl">Development ToDo App</div>
            </div>

            <!-- Middle section: white background -->
            <div class="w-full flex flex-col items-center bg-white p-4 border-l-black border-r-black">
                <img src="{{image_url}}" alt="image from picsum"
                    class="block w-full max-w-[200px] mt-8 mb-8 rounded-lg" />

                <div class="w-full flex justify-center items-center">
                    <form id=todoInputForm method="post" class=" w-full max-w-[500px] flex items-center gap-2">
                        <label for="todoinput" class="sr-only">Enter a new todo</label>
                        <input id="todoinput" name='todoinput' type="text" required maxlength="140"
                            placeholder="Enter a new todo (max 140 characters)"
                            class="w-full px-4 py-2 border border-green-500 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" />
                        <button type="submit"
                            class="bg-green-500 text-white px-4 py-2 rounded-md hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500">
                            Send
                        </button>
                    </form>
                </div>

                <script>

                    const form = document.getElementById('todoInputForm');

                    form.addEventListener('submit', async (e) => {
                        e.preventDefault(); // Prevent default form submission (no navigation)

                        const todo = document.getElementById('todoinput').value;
                        console.log(todo)

                        try {
                            // Send data to Express server via POST
                            const response = fetch('/todos', {
                                method: 'POST',
                                body: JSON.stringify({ 'todo': todo })

                            });

                            const data = await response;
                            console.log(response.ok == true)
                            if (response.ok) {
                                console.log('response ok, clear form')
                                form.reset(); // Clear form
                                window.location.reload();
                            } else {
                                console.log('response nok')
                                form.reset(); // Clear form
                                window.location.reload();
                            }
                        } catch (error) {
                            console.log('fetch gave an error')
                        }
                    });
                </script>

                <div class="w-full flex flex-col gap-2 items-left mt-5">
                    <div class="text-2xl mt-5 ml-5">ToDo's</div>
                    <form id=markDoneForm method="put">
                        {% for todo in todo_list %}
                        {% if todo[1] == true %}
                        <div
                            class="bg-gray-200 w-full flex justify-center max-w-[750px] rounded-md shadow-md border-l-4 border-gray-500 px-4 py-2">
                            <div class="w-full items-left">
                                <p class="font-light line-through text-left">{{todo[2] | safe}}</p>
                            </div>
                            <div class="w-full items-right">
                                <p class="font-extrabold text-green-600 text-right pr-4">Done</p>
                            </div>
                        </div>
                        {% else %}
                        <input type="hidden" id="todo-id" value="{{todo[0]}}" />
                        <div
                            class="bg-gray-200 w-full flex justify-center max-w-[750px] rounded-md shadow-md border-l-4 border-green-500 px-4 py-2">
                            <div class="w-full items-left">
                                <p class="font-bold text-left">{{todo[2] | safe}}</p>
                            </div>
                            <div class="w-full items-right">
                                <p class="text-right">
                                    <button type="submit" id="{{todo[0] | safe}}"
                                        class="bg-blue-500 text-white px-2 py-1 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                        Mark done
                                    </button>
                                </p>
                            </div>
                        </div>
                        {% endif %}
                        {% endfor %}
                    </form>
                </div>

                <script>

                    const markForm = document.getElementById('markDoneForm');

                    markForm.addEventListener('submit', async (e) => {
                        e.preventDefault(); // Prevent default form submission (no navigation)
                        const id = e.submitter.id;
                        console.log("row id: " + id)
                        try {
                            // Send data to Express server via POST
                            const response = fetch('/todos/' + id, {
                                method: 'PUT',
                                body: JSON.stringify({ 'id': id })
                            });
                            const data = await response;
                            console.log('response ok')
                            window.location.reload();
                        } catch (error) {
                            console.log('fetch gave an error')
                        }
                    });
                </script>


                <!-- break_my_day -->
                <div class="w-full flex flex-col gap-2 items-center mt-5">
                    <div class="w-full flex justify-center items-center">
                        <form id=break method="post" action="/fail" class="max-w-[200px] flex items-center gap-2">
                            <button type="submit"
                                class="bg-red-500 text-white font-bold px-4 py-2 rounded-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-800">
                                Break!
                            </button>
                        </form>
                    </div>
                </div>

            </div>

            <!-- Red footer -->
            <div class="w-full h-14 flex items-center justify-center bg-[#693434]">
                <div class="text-white">© 2026 Frank Prins</div>
            </div>
        </div>
    </div>
</body>

</html>
