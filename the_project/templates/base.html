<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helsinki ToDo application</title>
    <!-- <link rel="stylesheet" href="./static/site.css" /> -->
    <link rel="stylesheet" href="./static/my-tailwind.css" />
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100">
    <div class="container py-10 px-4 mx-auto max-w-[800px] flex flex-col items-center">

        <div class="w-full flex flex-col items-center rounded-xl overflow-hidden bg-gray-300">
            <!-- Red header -->
            <div class="w-full h-16 flex items-center justify-center bg-[#693434]">
                <div class="text-white text-3xl">ToDo App</div>
            </div>

            <!-- Middle section: white background -->
            <div class="w-full flex flex-col items-center bg-white p-4 border-l-black border-r-black">
                <img src="{{image_url}}" alt="image from picsum"
                    class="block w-full max-w-[200px] mt-8 mb-8 rounded-lg" />

                <div class="w-full flex justify-center items-center">
                    <form class="w-full max-w-[500px] flex items-center gap-2">
                        <label for="todo-input" class="sr-only">Enter a new todo</label>
                        <input id="todo-input" type="text" placeholder="Enter a new todo (max 140 characters)"
                            class="w-full px-4 py-2 border border-green-500 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                        <button type="submit"
                            class="bg-green-500 text-white px-4 py-2 rounded-md hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500">
                            Send
                        </button>
                    </form>
                </div>

                

                <div class="w-full flex flex-col gap-2 items-left mt-5">
                    <div class="text-2xl mt-5 ml-5">ToDo's</div>
                    {% for todo in todo_list %}
                    <div class="bg-gray-200 w-full max-w-[750px] border-l-4 border-green-500 pl-4 py-2">
                        <p class="font-bold text-left">{{todo}}</p>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <!-- Red footer -->
            <div class="w-full h-14 flex items-center justify-center bg-[#693434]">
                <div class="text-white">© 2026 Frank Prins</div>
            </div>
        </div>
    </div>
</body>

</html>
