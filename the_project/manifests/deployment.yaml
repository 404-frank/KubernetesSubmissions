apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: shared-image
          persistentVolumeClaim:
            claimName: the-project-claim
      containers:
        - name: todo-app
          image: twodogwalker/todo-app:0.31
          volumeMounts:
          - name: shared-image
            mountPath: /usr/app/static/sharedfiles
          envFrom:
            - configMapRef:
                name: the-project-configmap
        - name: todo-app-backend
          image: twodogwalker/todo-app-backend:0.11
          env:
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: password
          envFrom:
            - configMapRef:
                name: the-project-configmap
      # only necessary when the mount needs to be reactivated
      # initContainers:
      # - name: volume-mount-hack
      #   image: busybox
      #   command: ["sh", "-c", "chmod 777 /usr/app/static/sharedfiles"]
      #   volumeMounts:
      #   - name: shared-image
      #     mountPath: /usr/app/static/sharedfiles