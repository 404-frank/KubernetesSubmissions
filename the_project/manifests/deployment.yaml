apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: shared-image
          persistentVolumeClaim:
            claimName: the-project-claim
      containers:
        - name: todo-app
          image: twodogwalker/todo-app:0.33
          volumeMounts:
          - name: shared-image
            mountPath: /usr/app/static/sharedfiles
          envFrom:
            - configMapRef:
                name: the-project-configmap
          startupProbe:
            httpGet:
               path: /healthz
               port: 3000
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30  # 5 * 30 = 150 seconds max startup
            timeoutSeconds: 5
          livenessProbe:
            periodSeconds: 10 # How often to test
            httpGet:
               path: /healthz
               port: 3000
            failureThreshold: 1
          readinessProbe:
            initialDelaySeconds: 25 # Initial delay until the livenessProbe is tested
            periodSeconds: 20 # How often to test
            httpGet:
               path: /healthz
               port: 3000
        - name: todo-app-backend
          image: twodogwalker/todo-app-backend:0.16
          env:
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: password
          envFrom:
            - configMapRef:
                name: the-project-configmap
          startupProbe:
            httpGet:
               path: /healthz
               port: 3001
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30  # 5 * 30 = 150 seconds max startup
            timeoutSeconds: 5
          livenessProbe:
            periodSeconds: 10 # How often to test
            httpGet:
               path: /healthz
               port: 3001
            failureThreshold: 1
          readinessProbe:
            initialDelaySeconds: 25 # Initial delay until the livenessProbe is tested
            periodSeconds: 20 # How often to test
            httpGet:
               path: /healthz
               port: 3001
#      only necessary when the mount needs to be reactivated
      initContainers:
      - name: volume-mount-hack
        image: busybox
        command: ["sh", "-c", "chmod 777 /usr/app/static/sharedfiles"]
        volumeMounts:
        - name: shared-image
          mountPath: /usr/app/static/sharedfiles
      # resources
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "512Mi"
          cpu: "500m"