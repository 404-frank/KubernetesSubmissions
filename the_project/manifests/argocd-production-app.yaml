apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: the-project-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/404-frank/KubernetesSubmissions/
    path: ./the_project/manifests/overlays/production
    targetRevision: prod
  destination:
    server: https://kubernetes.default.svc
    namespace: project-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true