apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: project
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongo
          image: mongo:8.3.11
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: password
          envFrom:
            - configMapRef:
                name: the-project-configmap
          volumeMounts:
            - name: shared-image
              mountPath: /var/lib/mongodb/data
      volumes:
        - name: shared-image
          persistentVolumeClaim:
            claimName: the-project-claim
